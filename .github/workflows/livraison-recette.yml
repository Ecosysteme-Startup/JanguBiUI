# ==============================================================================
# Livraison en recette — front web Jàngu Bi (Next.js standalone). Contrat :
# Ecosysteme-Startup/Infrastructure, docs/CONTRAT_IMPLEMENTATION.md §6 et
# apps/jangubi/README.md. Modèle : la CI de l'agenda (eventsapi).
#
#   push stage        → qualité, DEUX images du même commit —
#                       sha-<commit>-staging et sha-<commit>-prod (NEXT_PUBLIC_*
#                       figés à la construction) —, puis `repository_dispatch`
#                       `livraison-staging` {app: jangubi, composant: web}
#   workflow_dispatch → qualité seule (sauf lancé sur stage : livraison)
#   develop / main    → rien ici (nextjs.yml ; la production se promeut dans
#                       l'Infrastructure en recopiant l'empreinte -prod)
#
# Secrets requis   : DOCKERHUB_USERNAME, DOCKERHUB_TOKEN, INFRA_DISPATCH_TOKEN
# Secrets facultatifs : SENTRY_AUTH_TOKEN (source maps, secret BuildKit)
# Variables (facultatives, défauts = contrat) :
#   INFRA_REPO (Ecosysteme-Startup/Infrastructure), IMAGE_REPO (soszaboss/jangubi-frontend),
#   NEXT_PUBLIC_SENTRY_DSN,
#   NEXT_PUBLIC_KEYCLOAK_CONSOLE_URL_STAGING, NEXT_PUBLIC_KEYCLOAK_CONSOLE_URL_PROD
#
# Connexion Keycloak (Auth.js) : variables d'EXÉCUTION du conteneur, fournies
# par l'Infrastructure (AUTH_SECRET, AUTH_URL, AUTH_KEYCLOAK_ID,
# AUTH_KEYCLOAK_ISSUER, AUTH_KEYCLOAK_INTERNAL_ISSUER) ; rien ici.
#
# Runners : tout sur `ceac` (pas de runner hébergé, plan gratuit) — mêmes
# précautions que l'API : permissions minimales, secrets étape par étape,
# persist-credentials: false, aucun pull_request, conteneurs bornés,
# constructeur BuildKit borné `ceac-ci`, pas de cache `type=gha`.
# ==============================================================================
name: Livraison recette (web)

on:
  push:
    branches: [stage]
    paths-ignore: ["docs/**", "**/*.md", "graphify-out/**"]
  workflow_dispatch:

permissions:
  contents: read

env:
  INFRA_REPO: ${{ vars.INFRA_REPO || 'Ecosysteme-Startup/Infrastructure' }}
  # Doit être le dépôt déclaré dans Infrastructure envs/*/versions.env
  # (JANGUBI_WEB_IMAGE) : une autre valeur est refusée à la livraison.
  IMAGE_REPO: ${{ vars.IMAGE_REPO || 'soszaboss/jangubi-frontend' }}

concurrency:
  group: livraison-jangubi-web-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/stage' }}

jobs:
  qualite:
    name: Qualité (lint, types, tests unitaires)
    runs-on: [self-hosted, ceac]
    timeout-minutes: 30
    # Même Node que l'image livrée (Dockerfile : node:22-alpine).
    container:
      image: node:22-alpine
      options: --memory=2g --memory-swap=2g --cpus=1.5 --oom-score-adj=800
    # Tas V8 explicite : sans lui, Node le plafonne vers 1 Go dans ce conteneur
    # de 2 Go et `tsc` meurt (« JavaScript heap out of memory »).
    env:
      NODE_OPTIONS: --max-old-space-size=1536
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Dépendances
        run: yarn install --frozen-lockfile --network-timeout 600000
      - name: ESLint
        run: yarn lint
      - name: TypeScript
        run: yarn check-types
      - name: Vitest
        run: yarn test --run
      - name: Rendre l espace de travail au runner
        if: always()
        run: chown -R "$(stat -c %u:%g "$GITHUB_WORKSPACE/..")" "$GITHUB_WORKSPACE" "$RUNNER_TEMP"

  # Les deux variantes dans UN job, l'une après l'autre : les deux empreintes
  # sortent ensemble, ou le job échoue (pas de livraison sans -prod).
  image:
    name: Images -staging et -prod
    needs: qualite
    if: github.ref == 'refs/heads/stage'
    runs-on: [self-hosted, ceac]
    timeout-minutes: 60
    outputs:
      commit: ${{ steps.vars.outputs.commit }}
      digest-staging: ${{ steps.build-staging.outputs.digest }}
      digest-prod: ${{ steps.build-prod.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Commit court
        id: vars
        env:
          SHA: ${{ github.sha }}
        run: echo "commit=${SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Constructeur borné ceac-ci
        uses: docker/setup-buildx-action@v3
        with:
          driver: remote
          endpoint: docker-container://buildx_buildkit_ceac-ci0

      - name: Connexion à DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construire et pousser (-staging)
        id: build-staging
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.IMAGE_REPO }}:sha-${{ steps.vars.outputs.commit }}-staging
          build-args: |
            NEXT_PUBLIC_API_URL=https://api-jangubi.ceac.dev/api/v1
            NEXT_PUBLIC_WS_URL=wss://api-jangubi.ceac.dev
            NEXT_PUBLIC_KEYCLOAK_CONSOLE_URL=${{ vars.NEXT_PUBLIC_KEYCLOAK_CONSOLE_URL_STAGING }}
            NEXT_PUBLIC_APP_STORE_URL=${{ vars.NEXT_PUBLIC_APP_STORE_URL }}
            NEXT_PUBLIC_PLAY_STORE_URL=${{ vars.NEXT_PUBLIC_PLAY_STORE_URL }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
          # Jeton Sentry : secret BuildKit, absent des couches de l'image.
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Construire et pousser (-prod)
        id: build-prod
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.IMAGE_REPO }}:sha-${{ steps.vars.outputs.commit }}-prod
          build-args: |
            NEXT_PUBLIC_API_URL=https://api-jangubi.ceac.sn/api/v1
            NEXT_PUBLIC_WS_URL=wss://api-jangubi.ceac.sn
            NEXT_PUBLIC_KEYCLOAK_CONSOLE_URL=${{ vars.NEXT_PUBLIC_KEYCLOAK_CONSOLE_URL_PROD }}
            NEXT_PUBLIC_APP_STORE_URL=${{ vars.NEXT_PUBLIC_APP_STORE_URL }}
            NEXT_PUBLIC_PLAY_STORE_URL=${{ vars.NEXT_PUBLIC_PLAY_STORE_URL }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
          # Jeton Sentry : secret BuildKit, absent des couches de l'image.
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  livraison-staging:
    name: Notifier l'infrastructure (livraison-staging)
    needs: image
    if: github.ref == 'refs/heads/stage'
    runs-on: [self-hosted, ceac]
    timeout-minutes: 10
    steps:
      - name: Contrôler les deux empreintes
        env:
          STAGING: ${{ needs.image.outputs.digest-staging }}
          PROD: ${{ needs.image.outputs.digest-prod }}
        run: |
          case "$STAGING" in sha256:*) ;; *) echo "::error::empreinte -staging absente"; exit 1 ;; esac
          case "$PROD" in sha256:*) ;; *) echo "::error::empreinte -prod absente"; exit 1 ;; esac
          [ "$STAGING" != "$PROD" ] || { echo "::error::variantes identiques"; exit 1; }

      - name: repository_dispatch → infrastructure
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.INFRA_DISPATCH_TOKEN }}
          repository: ${{ env.INFRA_REPO }}
          event-type: livraison-staging
          client-payload: |
            {
              "app": "jangubi",
              "composant": "web",
              "commit": "${{ needs.image.outputs.commit }}",
              "images": {
                "staging": "${{ env.IMAGE_REPO }}@${{ needs.image.outputs.digest-staging }}",
                "prod": "${{ env.IMAGE_REPO }}@${{ needs.image.outputs.digest-prod }}"
              }
            }

      - name: Résumé
        env:
          COMMIT: ${{ needs.image.outputs.commit }}
          STAGING: ${{ needs.image.outputs.digest-staging }}
          PROD: ${{ needs.image.outputs.digest-prod }}
        run: |
          {
            echo "## Livraison en recette notifiée"
            echo "- Recette : \`${IMAGE_REPO}@${STAGING}\`"
            echo "- Candidate production : \`${IMAGE_REPO}@${PROD}\`"
            echo "- Commit : \`${COMMIT}\`"
          } >> "$GITHUB_STEP_SUMMARY"
