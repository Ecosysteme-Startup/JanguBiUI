name: CI JanguBi Frontend

on:
  push:
    # Qualité seule. Livraison : push `stage` → .github/workflows/livraison-recette.yml
    # (runner ceac, contrat de l'Infrastructure Ecosysteme-Startup).
    branches: [main, develop]
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    branches: [main, develop, stage]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ['docs/**', '**/*.md']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ═══════════════════════════════════════════════
  # JOB 1 : Qualité du code
  # Lint + TypeScript + Build check
  # ═══════════════════════════════════════════════
  lint-and-typecheck:
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 #v6.0.3

      - name: Setup Node.js 22
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e #v4.3.0
        with:
          node-version: '22'
      
      - name: Installer yarn
        run: npm install -g yarn
        # npm est toujours disponible avec Node
        # Cette commande rend yarn disponible globalement
        # Simple, fiable, compatible avec act et GitHub Actions

      - name: Cache yarn
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae #v5.0.5
        with:
          path: /.cache/yarn
          key: yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            yarn-
        # Cache géré manuellement APRÈS que yarn existe

      - name: Install dependencies
        run: yarn install --frozen-lockfile
        # --frozen-lockfile = échoue si yarn.lock ne correspond pas
        # Garantit des versions exactes et reproductibles en CI

      - name: Run ESLint
        run: yarn lint
        # Vérifie le style et les erreurs évidentes

      - name: TypeScript check
        run: yarn check-types
        # Vérifie les types sans compiler
        # Équivalent de mypy pour Python

      - name: Tests unitaires
        run: yarn test --run

      - name: Build Next.js
        # Vérifie que l'app compile entièrement
        # Si une page est cassée → détecté ici avant le Docker build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          NEXT_TELEMETRY_DISABLED: 1
          # ↑ Désactive l'envoi de données à Vercel pendant le build CI
        run: yarn build
